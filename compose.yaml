name: amogus

x-amogus-image: &amogus-image
  build: .
  image: amogusbot:local

services:
  search:
    <<: *amogus-image
    container_name: amogusbot-search
    command: ["python3", "search.py"]
    restart: unless-stopped
    init: true
    environment:
      SEARCH_HOST: "0.0.0.0"
      PORT: "5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  bot:
    <<: *amogus-image
    container_name: amogusbot
    command: ["./amogusbot"]
    restart: unless-stopped
    init: true
    depends_on:
      search:
        condition: service_healthy
    env_file:
      - .env
    environment:
      YTMUSIC_SEARCH_BASE_URL: "http://search:5000"
      MAX_CONCURRENT_STREAMS: "${MAX_CONCURRENT_STREAMS:-2}"
